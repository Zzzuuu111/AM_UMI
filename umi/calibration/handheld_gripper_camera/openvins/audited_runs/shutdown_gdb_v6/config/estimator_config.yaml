%YAML:1.0
# First OpenVINS candidate for the rigid EMEET + JY901B hand-held rig.
# This is an offline experiment configuration; it is not used by robot control.
verbosity: "INFO"
use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1

# Keep independently validated calibration fixed in the first run.  We test
# the estimator, rather than allowing it to absorb errors by changing every
# sensor parameter online.
calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 2
gravity_mag: 9.80665

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 50
zupt_max_disparity: 2.0
zupt_only_at_beginning: true

init_window_time: 2.0
init_imu_thresh: 0.6
init_max_disparity: 15.0
init_max_features: 80
init_dyn_use: true
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 2
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-20
init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

record_timing_information: true
record_timing_filepath: "/output/timing.txt"

use_klt: true
num_pts: 250
fast_threshold: 15
grid_x: 6
grid_y: 4
min_px_dist: 18
knn_ratio: 0.65
track_frequency: 30.0
downsample_cameras: false
num_opencv_threads: 2
histogram_method: "CLAHE"

use_aruco: false
num_aruco: 50
downsize_aruco: true

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: true
mask0: "mask.png"
relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"

multi_threading_pubs: false
