<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>AM_UMI right_tcp 与 fixed-tip 候选点</title>
<style>
  body { margin: 0; padding: 24px; background: #101418; color: #e7edf3;
         font: 16px system-ui, sans-serif; }
  h1 { margin-top: 0; font-size: 22px; }
  .note { color: #b9c8d6; max-width: 940px; line-height: 1.55; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 16px;
          max-width: 1100px; margin-top: 18px; }
  figure { margin: 0; background: #19212a; border: 1px solid #344454; border-radius: 10px;
           padding: 12px; }
  figcaption { font-weight: 700; margin-bottom: 8px; }
  svg { width: 100%; height: auto; background: #0d1218; border-radius: 6px; }
  .tcp { fill: #ff9f43; stroke: #fff3df; stroke-width: 2; }
  .tip { fill: #7ee787; stroke: #dcffe1; stroke-width: 2; }
  .axis-x { stroke: #ff6b6b; stroke-width: 3; } .axis-y { stroke: #6bc5ff; stroke-width: 3; }
  .axis-z { stroke: #bd93f9; stroke-width: 3; } .offset { stroke: #f5f7fa; stroke-width: 2.5; }
  .label { fill: #e7edf3; font-size: 15px; } .small { fill: #b9c8d6; font-size: 13px; }
  code { color: #9cdcfe; }
</style>
<h1>AM_UMI：<code>right_tcp</code> → <code>right_fixed_tip_candidate</code></h1>
<p class="note">
  这是当前 candidate bridge 的本地坐标示意，不是实时硬件读数，也不替换官方 ROS <code>right_tcp</code>。
  橙点为官方 <code>right_tcp</code> 原点；绿点为我们 replay 使用的固定爪内侧前端候选点。
  平移为 <code>[-22.9, -11.6, -3.9] mm</code>，总距离约 <code>26.0 mm</code>。
</p>
<div class="grid">
  <figure><figcaption>俯视：right_tcp 本地 X–Y</figcaption>
    <svg viewBox="0 0 300 255" aria-label="XY projection">
      <line class="axis-x" x1="150" y1="145" x2="255" y2="145"/><text class="small" x="260" y="150">+X</text>
      <line class="axis-y" x1="150" y1="145" x2="150" y2="40"/><text class="small" x="155" y="38">+Y</text>
      <line class="offset" x1="150" y1="145" x2="58" y2="191"/>
      <circle class="tcp" cx="150" cy="145" r="9"/><circle class="tip" cx="58" cy="191" r="9"/>
      <text class="label" x="160" y="169">right_tcp</text><text class="label" x="65" y="216">fixed-tip</text>
      <text class="small" x="62" y="72">ΔX = −22.9 mm</text><text class="small" x="62" y="91">ΔY = −11.6 mm</text>
    </svg>
  </figure>
  <figure><figcaption>侧视：right_tcp 本地 X–Z</figcaption>
    <svg viewBox="0 0 300 255" aria-label="XZ projection">
      <line class="axis-x" x1="150" y1="145" x2="255" y2="145"/><text class="small" x="260" y="150">+X</text>
      <line class="axis-z" x1="150" y1="145" x2="150" y2="40"/><text class="small" x="155" y="38">+Z</text>
      <line class="offset" x1="150" y1="145" x2="58" y2="161"/>
      <circle class="tcp" cx="150" cy="145" r="9"/><circle class="tip" cx="58" cy="161" r="9"/>
      <text class="label" x="160" y="169">right_tcp</text><text class="label" x="65" y="186">fixed-tip</text>
      <text class="small" x="62" y="72">ΔX = −22.9 mm</text><text class="small" x="62" y="91">ΔZ = −3.9 mm</text>
    </svg>
  </figure>
  <figure><figcaption>前视：right_tcp 本地 Y–Z</figcaption>
    <svg viewBox="0 0 300 255" aria-label="YZ projection">
      <line class="axis-y" x1="150" y1="145" x2="255" y2="145"/><text class="small" x="260" y="150">+Y</text>
      <line class="axis-z" x1="150" y1="145" x2="150" y2="40"/><text class="small" x="155" y="38">+Z</text>
      <line class="offset" x1="150" y1="145" x2="104" y2="161"/>
      <circle class="tcp" cx="150" cy="145" r="9"/><circle class="tip" cx="104" cy="161" r="9"/>
      <text class="label" x="160" y="169">right_tcp</text><text class="label" x="109" y="186">fixed-tip</text>
      <text class="small" x="62" y="72">ΔY = −11.6 mm</text><text class="small" x="62" y="91">ΔZ = −3.9 mm</text>
    </svg>
  </figure>
</div>
<p class="note">坐标轴旋转约 175.8° 是 ROS <code>right_tcp</code> 与手持 fixed-tip 轴定义的约定差异；它不是夹爪在实物上发生了额外旋转。</p>
</html>
